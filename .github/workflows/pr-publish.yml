name: PR publish

# Runs with the repository's own code only: takes the "PR build" artifact, checks it against the base branch,
# publishes it as the pr-<number>-<version> pre-release, verifies what a server will fetch and keeps one
# comment on the pull request current. Never checks out or runs pull request code.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] takes only the build artifact and never runs pull request code
    workflows: ["PR build"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read
  issues: read

concurrency:
  group: pr-publish-${{ github.event.workflow_run.head_repository.owner.login }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
  # every PR build run queues here, a skipped one too: the default keeps one pending run and would drop a press's
  queue: max

env:
  PLUGIN_NAME: ca.mover.tuning
  LABEL: test-build
  MARKER: '<!-- pr-build -->'
  GH_TOKEN: ${{ github.token }}
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  publish:
    # failed, cancelled and timed-out builds come in too, so the Find step can note them; action_required has not run yet
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && contains(fromJSON('["success", "failure", "cancelled", "timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
    - name: Find the labelled pull request this build belongs to
      id: pr
      env:
        HEAD: ${{ github.event.workflow_run.head_repository.owner.login }}:${{ github.event.workflow_run.head_branch }}
        # who first started the run: a re-run keeps it, so a re-run is judged on its first starter's press
        RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
        CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        RUN_CREATED: ${{ github.event.workflow_run.created_at }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      run: |
        set -euo pipefail
        # gh encodes the fields; a branch name may hold & # + and would split a hand-built query
        open=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f per_page=100 -f head="$HEAD")
        number=$(jq -r --arg sha "$HEAD_SHA" 'map(select(.head.sha == $sha)) | .[0].number // empty' <<<"$open")
        moved=""
        if [ -z "$number" ]; then
          # commits pushed since this build: it is refused below, so the pull request is noted
          found=$(jq -r --arg l "$LABEL" 'map(select(any(.labels[]; .name == $l))) | .[0] // empty | "\(.number) \(.head.sha)"' <<<"$open")
          read -r number moved <<<"$found"
        fi
        if [ -z "$number" ]; then
          echo "No open pull request at $HEAD is at ${HEAD_SHA::7} or carries the $LABEL label; nothing to publish."
          exit 0
        fi
        # the label is the maintainer's go; checked here too because this is the privileged job
        labels=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.labels[].name')
        if ! grep -qx -- "$LABEL" <<<"$labels"; then
          echo "Pull request #$number does not carry the $LABEL label; nothing to publish."
          exit 0
        fi
        # from here on, a refusal or a failed lookup still updates the comment
        echo "number=$number" >> "$GITHUB_OUTPUT"
        refuse() { echo "refused=$1" >> "$GITHUB_OUTPUT"; echo "::error::Not published: $1."; exit 1; }
        # the pull request's own copy of PR build runs, on any event it names: the go is a run its starter's press began.
        # Unreadable, no press can be told apart, so the label comes off
        presses=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/events?per_page=100" \
          --jq ".[] | select(.event == \"labeled\" and .label.name == \"$LABEL\") | \"\(.created_at) \(.actor.login)\"") \
          || { echo "unlabel=true" >> "$GITHUB_OUTPUT"; exit 1; }
        created=$(date -d "$RUN_CREATED" +%s)
        pressed=""
        while read -r at by; do
          [ "$by" = "$RUN_ACTOR" ] || continue
          age=$((created - $(date -d "$at" +%s)))
          # a run is created after its press (2-5 s on this repo's 20 latest test builds): the latest press by its starter up to 5 minutes before
          if [ "$age" -ge 0 ] && [ "$age" -le 300 ]; then pressed=$at; fi
        done <<<"$presses"
        # the label is its latest press's: any other run leaves it to that press's own run, which may still be building
        if [ -n "$pressed" ] && [ "$pressed" = "$(sort <<<"$presses" | tail -n 1 | cut -d' ' -f1)" ]; then
          echo "unlabel=true" >> "$GITHUB_OUTPUT"
        fi
        [ -n "$pressed" ] || refuse "no press of the \`$LABEL\` label by \`$RUN_ACTOR\` in the 5 minutes before this run was created"
        # the press's own run is the first one its presser started on this head after it; a later one may build later commits
        runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/pr-build.yml/runs" -f actor="$RUN_ACTOR" \
          -f event=pull_request -f created="$pressed..$RUN_CREATED" -f per_page=100)
        first=$(jq -r --arg a "$RUN_ACTOR" --arg r "$HEAD_REPO" --arg b "$HEAD_BRANCH" --arg s "$pressed" '[.workflow_runs[]
          | select(.actor.login == $a and .head_repository.full_name == $r and .head_branch == $b and .created_at >= $s
            and .conclusion != "skipped")] | min_by(.id) | .id' <<<"$runs")
        [ "$first" = "$RUN_ID" ] || refuse "it is not the first run \`$RUN_ACTOR\` started after pressing the \`$LABEL\` label"
        permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$RUN_ACTOR/permission" --jq .permission)
        [[ "$permission" == admin || "$permission" == write ]] \
          || refuse "the \`$LABEL\` label was added by \`$RUN_ACTOR\`, who cannot ask for a test build"
        [ -z "$moved" ] || refuse "the pull request has moved on to ${moved::7} since"
        [ "$CONCLUSION" = success ] || refuse "the build ended as \`$CONCLUSION\`"

    - name: Download the build
      if: steps.pr.outputs.number != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: pr-build
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}
        path: out

    - name: Install xmllint
      if: steps.pr.outputs.number != ''
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

    - name: Check the build against the base branch
      if: steps.pr.outputs.number != ''
      id: meta
      env:
        PR: ${{ steps.pr.outputs.number }}
      run: |
        set -euo pipefail
        # everything in out/ was written by the pull request's own build; the base branch's manifest is the reference
        base=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .base.ref)
        [[ "$base" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::unexpected base branch '$base'"; exit 1; }
        gh api "repos/$GITHUB_REPOSITORY/contents/plugins/$PLUGIN_NAME.plg?ref=$base" --jq .content | base64 -d > base.plg
        entity() { grep -o "<!ENTITY $1 *\"[^\"]*\"" "$2" | grep -o '"[^"]*"' | tr -d '"'; }
        release=$(entity version base.plg)
        version=$(tr -d '[:space:]' < out/version)
        # the version must sort above the current release and below the next one (see PR build)
        [[ "$version" == "$release.0"* && "${version#"$release.0"}" =~ ^[0-9]{12}$ ]] \
          || { echo "::error::version '$version' is not '$release.0<build time>'; if the base branch released since the build, add the label again"; exit 1; }
        plg="out/$PLUGIN_NAME.plg"
        package="$PLUGIN_NAME-$version-x86_64-1.txz"
        [ -s "$plg" ] && [ -s "out/$package" ] || { echo "::error::expected $plg and out/$package in the build"; exit 1; }
        # the built manifest is read parsed, the way Unraid reads it, never as text: a comment can hold anything
        xpath() { xmllint --xpath "$1" "$plg"; }
        [ "$(xpath 'string(/PLUGIN/@version)')" = "$version" ] || { echo "::error::the manifest's version is not $version"; exit 1; }
        md5=$(md5sum "out/$package" | cut -d' ' -f1)
        [ "$(xpath 'string(/PLUGIN/FILE[URL]/MD5)')" = "$md5" ] || { echo "::error::the manifest's package MD5 is not $md5"; exit 1; }
        # pluginURL outlives the test: servers keep checking it for updates, so it must be the base branch's
        want_url=$(xmllint --xpath 'string(/PLUGIN/@pluginURL)' base.plg)
        got_url=$(xpath 'string(/PLUGIN/@pluginURL)')
        [ -n "$want_url" ] && [ "$got_url" = "$want_url" ] || { echo "::error::manifest pluginURL '$got_url' differs from the base branch's '$want_url'"; exit 1; }
        # only the package download moves to the pull request release; after that it must be the manifest's one download
        tag="pr-$PR-$version"
        release_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
        sed -i "s|<URL>https://github.com/&github;/releases/download/&version;/&name;-&version;-x86_64-1.txz</URL>|<URL>$release_url/$package</URL>|" "$plg"
        [ "$(xpath 'count(/PLUGIN/FILE/URL)')" = 1 ] && [ "$(xpath 'string(/PLUGIN/FILE/URL)')" = "$release_url/$package" ] \
          || { echo "::error::the manifest must have one download, $release_url/$package"; exit 1; }
        { echo "version=$version"; echo "tag=$tag"; echo "package=$package"; echo "md5=$md5"; echo "install_url=$release_url/$PLUGIN_NAME.plg"; } >> "$GITHUB_OUTPUT"

    - name: Publish the pre-release
      if: steps.pr.outputs.number != ''
      id: publish
      env:
        PR: ${{ steps.pr.outputs.number }}
        TAG: ${{ steps.meta.outputs.tag }}
        VERSION: ${{ steps.meta.outputs.version }}
        PACKAGE: ${{ steps.meta.outputs.package }}
        INSTALL_URL: ${{ steps.meta.outputs.install_url }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        notes=$(mktemp)
        {
          echo "Test build of pull request #$PR at ${HEAD_SHA::7}. Not a release: the next build of this pull request replaces it, PR cleanup's hourly sweep removes it after the pull request closes, and the next real release supersedes it on installed servers."
          echo
          echo "Install: Plugins > Install Plugin > paste \`$INSTALL_URL\`"
        } > "$notes"
        # a re-run of this build meets its own release, the same bytes and maybe already announced: keep it, verify it
        if gh release view --repo "$GITHUB_REPOSITORY" "$TAG" >/dev/null 2>&1; then
          echo "$TAG exists already (a re-run of this build); verifying it instead of publishing it again."
        else
          # a fork's head commit is not in this repository, so the tag sits on the default branch; the notes name the commit
          gh release create --repo "$GITHUB_REPOSITORY" "$TAG" "out/$PACKAGE" "out/$PLUGIN_NAME.plg" --target "$DEFAULT_BRANCH" --prerelease \
            --title "Test build $VERSION (pull request #$PR, ${HEAD_SHA::7})" --notes-file "$notes"
          echo "created=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Verify what a server will fetch
      if: steps.pr.outputs.number != ''
      id: verify
      env:
        INSTALL_URL: ${{ steps.meta.outputs.install_url }}
        PACKAGE: ${{ steps.meta.outputs.package }}
        WANT: ${{ steps.meta.outputs.md5 }}
      run: |
        set -euo pipefail
        # Assets take a few seconds to serve after a release is created.
        for attempt in 1 2 3 4 5 6; do
          if curl --connect-timeout 15 --max-time 120 -fsSL -o got.plg "$INSTALL_URL" \
             && curl --connect-timeout 15 --max-time 120 -fsSL -o got.txz "${INSTALL_URL%/*}/$PACKAGE"; then break; fi
          [ "$attempt" -lt 6 ] || { echo "::error::assets not downloadable after $attempt attempts"; exit 1; }
          sleep 10
        done
        cmp -s got.plg "out/$PLUGIN_NAME.plg" || { echo "::error::served manifest differs from the built one"; exit 1; }
        got=$(md5sum got.txz | cut -d' ' -f1)
        [ "$got" = "$WANT" ] || { echo "::error::served package md5 $got does not match the manifest's $WANT"; exit 1; }
        echo "::notice::install URL: $INSTALL_URL"

    - name: Remove the unverified build
      if: failure() && steps.verify.outcome == 'failure' && steps.publish.outputs.created == 'true'
      env:
        TAG: ${{ steps.meta.outputs.tag }}
      run: |
        # PR cleanup may remove it first: "release not found", or a 404 when it does so between gh's lookup and its
        # delete, is that outcome, anything else is not
        out=$(gh release delete --repo "$GITHUB_REPOSITORY" "$TAG" --cleanup-tag --yes 2>&1) \
          || [[ "$out" == *"release not found"* || "$out" == *"HTTP 404"* ]] || { echo "$out" >&2; exit 1; }

    - name: Remove older builds of this pull request
      if: steps.pr.outputs.number != ''
      env:
        PR: ${{ steps.pr.outputs.number }}
        TAG: ${{ steps.meta.outputs.tag }}
      run: |
        set -euo pipefail
        gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
          --jq ".[] | select(.prerelease and .tag_name != \"$TAG\" and (.tag_name | startswith(\"pr-$PR-\"))) | .tag_name" \
          | while read -r old; do
              out=$(gh release delete --repo "$GITHUB_REPOSITORY" "$old" --cleanup-tag --yes 2>&1) \
                || [[ "$out" == *"release not found"* || "$out" == *"HTTP 404"* ]] || { echo "$out" >&2; exit 1; }
              echo "removed $old"
            done

    - name: Undo the release if the pull request closed meanwhile
      if: always() && steps.verify.outcome == 'success'
      id: closed
      env:
        PR: ${{ steps.pr.outputs.number }}
        TAG: ${{ steps.meta.outputs.tag }}
      run: |
        set -euo pipefail
        # its own line, so set -e stops on an unreadable pull request instead of removing an open one's build
        state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .state)
        # PR cleanup's sweep may get there first ("release not found", or a 404 between gh's lookup and its delete).
        # The tag stays: that sweep finds it, notes the comment and removes it, so a failed note below is redone
        if [ "$state" != "open" ]; then
          out=$(gh release delete --repo "$GITHUB_REPOSITORY" "$TAG" --yes 2>&1) \
            || [[ "$out" == *"release not found"* || "$out" == *"HTTP 404"* ]] || { echo "$out" >&2; exit 1; }
          echo "closed=true" >> "$GITHUB_OUTPUT"
          echo "Pull request #$PR closed while publishing; the release was removed again."
        fi

    - name: Update the pull request comment
      # also on failure: a workflow_run job is not a check on the pull request, so this is where a maintainer sees it
      if: always() && steps.pr.outputs.number != ''
      env:
        PR: ${{ steps.pr.outputs.number }}
        VERSION: ${{ steps.meta.outputs.version }}
        INSTALL_URL: ${{ steps.meta.outputs.install_url }}
        BUILD_LOG: ${{ github.event.workflow_run.html_url }}
        VERIFIED: ${{ steps.verify.outcome == 'success' }}
        CLOSED: ${{ steps.closed.outputs.closed == 'true' }}
        TAG: ${{ steps.meta.outputs.tag }}
        REFUSED: ${{ steps.pr.outputs.refused }}
        UNLABEL: ${{ steps.pr.outputs.unlabel == 'true' }}
      run: |
        set -euo pipefail
        removed=$(printf '%s\n' "$MARKER" "The test build for this pull request has been removed.")
        logs="[build log]($BUILD_LOG), [publish log](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
        # mirrors the label step's condition
        next() { if [ "$UNLABEL" = true ]; then echo "$1"; else echo "The \`$LABEL\` label stays on, left for the run of its latest press."; fi; }
        if [ "$CLOSED" = true ]; then
          body=$removed
        elif [ "$VERIFIED" = true ]; then
          body=$(printf '%s\n' "$MARKER" "Test build \`$VERSION\` of ${HEAD_SHA::7} ([build log]($BUILD_LOG)). Install from Plugins, Install Plugin, with this URL:" "" '```' "$INSTALL_URL" '```' "" "It installs over the current release and the next real release supersedes it. $(next "Add the \`$LABEL\` label again for a new build.")")
        elif [ -n "$REFUSED" ]; then
          body=$(printf '%s\n' "$MARKER" "The build of ${HEAD_SHA::7} was not published: $REFUSED ($logs). $(next "A maintainer can check its commits and add the \`$LABEL\` label again.")")
        else
          body=$(printf '%s\n' "$MARKER" "The build of ${HEAD_SHA::7} was not published ($logs). $(next "Add the \`$LABEL\` label again to retry.")")
        fi
        id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
          --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" | head -n 1)
        if [ -n "$id" ]; then
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" -X PATCH -f body="$body" >/dev/null
        else
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -X POST -f body="$body" --jq .id)
        fi
        # checked after the write: PR cleanup may have removed the build since the closed check, and it notes after
        # its release deletes, so whichever note lands last says what is there
        [ "$VERIFIED" = true ] && [ "$CLOSED" != true ] || exit 0
        out=$(gh release view --repo "$GITHUB_REPOSITORY" "$TAG" 2>&1 >/dev/null) && exit 0
        [[ "$out" == *"release not found"* ]] || { echo "$out" >&2; exit 1; }
        gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" -X PATCH -f body="$removed" >/dev/null

    - name: Take the label off so the next build needs a new go
      # only for its latest press's run, or when the Find step could not read the presses
      if: always() && steps.pr.outputs.unlabel == 'true'
      env:
        PR: ${{ steps.pr.outputs.number }}
      run: |
        # someone may have taken it off meanwhile: that 404 is the outcome wanted, any other error is not
        if ! err=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$LABEL" -X DELETE 2>&1 >/dev/null); then
          [[ "$err" == *"(HTTP 404)"* ]] || { echo "$err" >&2; exit 1; }
          echo "The $LABEL label was already off."
        fi
