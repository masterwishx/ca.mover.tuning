name: Universal Discord Notifier

on:
  release:
    types: [published]
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed, reopened]
  workflow_dispatch:

permissions: {}

jobs:
  notify_discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Notification
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action || '' }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}

          # Release info
          RELEASE_URL: ${{ github.event.release.html_url || '' }}
          RELEASE_BODY: ${{ github.event.release.body || '' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          RELEASE_NAME: ${{ github.event.release.name || '' }}

          # PR / Issue info
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          PR_URL: ${{ github.event.pull_request.html_url || '' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_MERGED: ${{ github.event.pull_request.merged || '' }}

          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
          ISSUE_URL: ${{ github.event.issue.html_url || '' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}

        run: |
          # -----------------------------------------------------
          # Guard: Webhook must exist
          # -----------------------------------------------------
          if [ -z "${WEBHOOK}" ]; then
            echo "::warning::DISCORD_WEBHOOK is not set, skipping notification"
            exit 0
          fi

          # -----------------------------------------------------
          # Truncate bodies to 300 characters (not bytes)
          # -----------------------------------------------------
          truncate() {
            printf '%s' "$1" | python3 -c 'import sys; sys.stdout.write(sys.stdin.read()[:300])'
          }

          # -----------------------------------------------------
          # Determine event type
          # -----------------------------------------------------
          case "${EVENT}" in
            release)
              ICON="🚀"
              CONTENT="New Release Published"
              TITLE="${RELEASE_NAME:-Release ${RELEASE_TAG}}"
              URL="${RELEASE_URL}"
              BODY="$(truncate "${RELEASE_BODY}")"
              COLOR=3447003
              ;;
            pull_request)
              URL="${PR_URL}"
              TITLE="${PR_TITLE}"
              BODY="$(truncate "${PR_BODY}")"

              if [ "${ACTION}" = "opened" ]; then
                ICON="🔀"
                CONTENT="Pull Request Opened"
                COLOR=5763719
              elif [ "${ACTION}" = "closed" ] && [ "${PR_MERGED}" = "true" ]; then
                ICON="🎉"
                CONTENT="Pull Request Merged"
                COLOR=8311585
              elif [ "${ACTION}" = "reopened" ]; then
                ICON="🔁"
                CONTENT="Pull Request Reopened"
                COLOR=9807270
              else
                ICON="❌"
                CONTENT="Pull Request Closed"
                COLOR=10038562
              fi
              ;;
            issues)
              URL="${ISSUE_URL}"
              TITLE="${ISSUE_TITLE}"
              BODY="$(truncate "${ISSUE_BODY}")"

              if [ "${ACTION}" = "opened" ]; then
                ICON="🐞"
                CONTENT="New Issue Opened"
                COLOR=16776960
              elif [ "${ACTION}" = "closed" ]; then
                ICON="✅"
                CONTENT="Issue Closed"
                COLOR=10038562
              else
                ICON="🌀"
                CONTENT="Issue Reopened"
                COLOR=9807270
              fi
              ;;
            *)
              ICON="🧭"
              CONTENT="Manual Trigger"
              TITLE="Manual Trigger"
              URL="https://github.com/${REPO}"
              BODY="Workflow manually triggered by ${ACTOR}"
              COLOR=8421504
              ;;
          esac

          # -----------------------------------------------------
          # Build JSON using jq (safe & correct)
          # -----------------------------------------------------
          JSON=$(jq -n \
            --arg content "${ICON} ${CONTENT}" \
            --arg title "${TITLE}" \
            --arg url "${URL}" \
            --arg desc "${BODY}" \
            --arg actor "${ACTOR}" \
            --arg repo "${REPO}" \
            --arg timestamp "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg release_name "${RELEASE_NAME}" \
            --arg event "${EVENT}" \
            --argjson color "${COLOR}" \
            '
            {
              content: $content,
              embeds: [
                {
                  title: $title,
                  url: $url,
                  description: $desc,
                  color: $color,
                  timestamp: $timestamp,
                  fields: (
                    [
                      {name: "Repository", value: $repo, inline: true},
                      {name: "Actor", value: $actor, inline: true}
                    ]
                    +
                    (
                      if $event == "release" then
                        [
                          {name: "Release Tag", value: $release_tag, inline: true},
                          {name: "Release Name", value: $release_name, inline: true}
                        ]
                      else
                        []
                      end
                    )
                  )
                }
              ]
            }
            '
          )

          # -----------------------------------------------------
          # Send to Discord
          # -----------------------------------------------------
          curl --fail-with-body --silent --show-error \
               --connect-timeout 10 --max-time 30 \
               -H "Content-Type: application/json" \
               -d "${JSON}" \
               "${WEBHOOK}"
