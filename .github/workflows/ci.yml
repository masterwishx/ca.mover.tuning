name: CI

on:
  push:
    branches: [master, beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Manifest + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils perl

      - name: Validate plugin manifest (XML)
        run: xmllint --noout plugins/ca.mover.tuning.plg

      - name: Test mover file leases
        run: |
          bash -n source/ca.mover.tuning/usr/local/emhttp/plugins/ca.mover.tuning/age_mover
          bash .github/scripts/test_files_in_use.sh

      # CHANGELOG.md must render to the committed CHANGES block for this branch's channel,
      # pluginURL must point at this branch, and the manifest md5 must match the served package.
      - name: Verify changelog, manifest and served package agree
        run: |
          branch="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          channel=stable
          [ "$branch" != beta ] || channel=beta
          python3 .github/scripts/release/plg_release.py check \
            --changelog CHANGELOG.md --plg plugins/ca.mover.tuning.plg \
            --channel "$channel" --branch "$branch" --verify-asset

      - name: Test build
        run: |
          bash source/ca.mover.tuning/pkg_build.sh --version 0000.00.00 --out "$RUNNER_TEMP/dist"
          test -s "$RUNNER_TEMP/dist/ca.mover.tuning-0000.00.00-x86_64-1.txz"

  # The stable release PR's notes, checked before the merge: the release only warns about copied commit
  # subjects, and empty notes would stop it with the merge already done.
  release-notes:
    name: Release notes
    if: github.head_ref == 'release/stable'
    runs-on: ubuntu-latest
    env:
      PLG: plugins/ca.mover.tuning.plg
      CHANGELOG: CHANGELOG.md
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the check compares the bullets with every commit since the last stable release tag
          fetch-depth: 0
          persist-credentials: false

      - name: The notes have bullets and none is a copied commit subject
        run: |
          since=$(python3 .github/scripts/release/plg_release.py since-ref --changelog "$CHANGELOG" --channel stable)
          python3 .github/scripts/release/plg_release.py check --changelog "$CHANGELOG" --plg "$PLG" \
            --channel stable --branch "$GITHUB_BASE_REF" --require-nonempty --require-edited --since "$since"

  release-scripts:
    name: Release script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r .github/scripts/release/tests/requirements.txt

      - name: Run tests
        run: python -m pytest .github/scripts/release/tests -q

  age-mover:
    name: age_mover tests
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the age_mover tests
        env:
          AGE_MOVER_TEST: '1'
        run: bash tests/age_mover/run.sh

  # Dependabot's pull requests merge once the jobs above pass; release-notes runs only for the stable release PR.
  # The PR's author, not github.actor: the actor is whoever acted last and can be spoofed
  dependabot-merge:
    name: Merge Dependabot pull request
    needs: [validate, release-notes, release-scripts, age-mover]
    if: >-
      always() && github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.repository == github.event.pull_request.head.repo.full_name
      && needs.validate.result == 'success' && needs.release-scripts.result == 'success'
      && needs.age-mover.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.release-notes.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # the head this run tested: a newer push merges only after its own run passes
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --merge --match-head-commit "$HEAD_SHA" "$PR_URL"
